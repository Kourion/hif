# Publishes app/ to GitHub Pages. Enable it once under
# Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A new cache name per release makes installed apps pick up the update.
      - name: Stamp the service worker cache version
        run: sed -i "s/^const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::12}';/" app/sw.js && grep -q "${GITHUB_SHA::12}" app/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4

      # With "Deploy from a branch", GitHub also builds the repository on every
      # push and that build replaces the app with a page rendered from
      # README.md. The workflow token cannot change the setting, so flag it.
      - name: Check the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=Pages source is set to 'Deploy from a branch'::The app was deployed, but GitHub's branch build will replace it with the README. In Settings > Pages > Build and deployment, set Source to 'GitHub Actions'."
            exit 1
          fi
